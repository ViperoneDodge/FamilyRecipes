name: Compila app iPhone

# Si avvia a mano (Actions → Compila app iPhone → Run workflow): i Mac di GitHub costano
# 10 volte i minuti di Linux. Senza le chiavi di App Store Connect controlla solo che l'app
# compili; con le chiavi nei Secrets firma l'app e la carica su TestFlight.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26  # Xcode 26: necessario per i pacchetti attuali e per caricare sull App Store
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Versione di Xcode
        run: xcodebuild -version

      - name: Prepara il progetto iOS
        run: |
          flutter create --org it.familyrecipes --project-name familyrecipes --platforms ios .
          rm -f test/widget_test.dart
          python3 tool/patch_ios.py
          flutter pub get

      - name: Test
        run: flutter test

      # Controllo che l'app compili per iPhone, senza firma (solo se non ci sono le chiavi:
      # con le chiavi la compilazione la fa l'archivio firmato qui sotto).
      - name: Compila (senza firma)
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          if [ -n "$KEY_ID" ]; then echo "Chiavi presenti: compila il passo successivo."; exit 0; fi
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      # Firma e caricamento su TestFlight: solo se nei Secrets ci sono le chiavi di App Store Connect
      # (APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 = contenuto del file .p8, APPLE_TEAM_ID).
      # Certificato di distribuzione e profilo App Store li crea qui la chiave API (codemagic-cli-tools):
      # non servono iPhone registrati né certificati salvati. Il certificato viene revocato alla fine
      # (Apple ne consente pochi): le build già caricate restano valide.
      - name: Firma e carica su TestFlight
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APPSTORE_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "Chiavi di App Store Connect non configurate: app compilata ma non firmata né caricata."
            exit 0
          fi
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/cm"
          "$RUNNER_TEMP/cm/bin/pip" install -q codemagic-cli-tools
          export PATH="$RUNNER_TEMP/cm/bin:$PATH"
          ssh-keygen -t rsa -b 2048 -m PEM -f "$RUNNER_TEMP/cert_key" -q -N ""
          export CERTIFICATE_PRIVATE_KEY="$(cat "$RUNNER_TEMP/cert_key")"
          keychain initialize
          app-store-connect fetch-signing-files it.familyrecipes.familyrecipes \
            --type IOS_APP_STORE --platform IOS --create --delete-stale-profiles
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj
          flutter build ipa --release --build-number=${{ github.run_number }} \
            --export-options-plist="$HOME/export_options.plist"
          app-store-connect publish --path "$(ls build/ios/ipa/*.ipa | head -1)"
          echo "Caricata su App Store Connect: tra qualche minuto compare in TestFlight."

      - name: Revoca il certificato temporaneo
        if: always()
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APPSTORE_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          [ -f "$RUNNER_TEMP/cert_key" ] && [ -x "$RUNNER_TEMP/cm/bin/app-store-connect" ] || exit 0
          export PATH="$RUNNER_TEMP/cm/bin:$PATH"
          ids=$(app-store-connect certificates list --type DISTRIBUTION IOS_DISTRIBUTION \
                --certificate-key "@file:$RUNNER_TEMP/cert_key" --json \
                | python3 -c 'import json,sys; print(" ".join(c["id"] for c in json.load(sys.stdin)))') || exit 0
          for id in $ids; do app-store-connect certificates delete "$id" --ignore-not-found || true; done
          keychain use-login || true
